# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/Competition/{Application,Infrastructure} available as services.
    # Domain is excluded: none of its value objects/entities are meant to be DI services
    # (hexagonal purity - Domain has no framework awareness), so they shouldn't clutter
    # the container even though Symfony tolerates them being swept in without erroring.
    App\Competition\:
        resource: '../src/Competition/*'
        exclude:
            - '../src/Competition/Domain'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # tags every Application Handler as a Messenger handler in one shot, based on the
    # already-established naming convention (one *Handler.php per use case directory) —
    # no per-use-case block to add here going forward. Tag stays in config, not
    # #[AsMessageHandler] on the class, per ADR 008.
    App\Competition\Application\:
        resource: '../src/Competition/Application/*/*Handler.php'
        tags: ['messenger.message_handler']

    App\Competition\Domain\Repository\CompetitionRepository: '@App\Competition\Infrastructure\Persistence\Doctrine\DoctrineCompetitionRepository'
    App\Competition\Domain\Repository\PlayerRepository: '@App\Competition\Infrastructure\Persistence\Doctrine\DoctrinePlayerRepository'
    # TeamRepository ne porte que nextIdentity() (Team n'a pas de persistance propre, voir ADR 022) :
    # l'implémentation InMemory suffit aussi en production, pas de DoctrineTeamRepository nécessaire.
    App\Competition\Domain\Repository\TeamRepository: '@App\Competition\Infrastructure\Persistence\InMemory\InMemoryTeamRepository'

    # Exception ciblée à l'exclusion Domain/ ci-dessus (ADR 026 §6) : seule classe du Domain
    # enregistrée comme service, uniquement pour alimenter la map de BracketGeneratorFactory
    # ci-dessous. Ajouter un futur format = une classe générateur + une entrée ici, la factory
    # elle-même n'est jamais modifiée (OCP).
    App\Competition\Domain\Format\SingleElimination\SingleEliminationBracketGenerator: ~

    App\Competition\Domain\Service\BracketGeneratorFactory:
        arguments:
            $generatorsByFormat:
                single_elimination: '@App\Competition\Domain\Format\SingleElimination\SingleEliminationBracketGenerator'

    # port dupliqué depuis Organization (pas de dépendance vers celui d'Organization), voir ADR 027
    # "Conséquences" : un port technique partagé recréerait le couplage que deptrac empêche.
    App\Competition\Domain\Service\PasswordHasher: '@App\Competition\Infrastructure\Password\NativePasswordHasher'

    # makes classes in src/Organization/{Application,Infrastructure} available as services,
    # same convention as App\Competition\ above (Domain excluded, hexagonal purity).
    App\Organization\:
        resource: '../src/Organization/*'
        exclude:
            - '../src/Organization/Domain'

    App\Organization\Application\:
        resource: '../src/Organization/Application/*/*Handler.php'
        tags: ['messenger.message_handler']

    App\Organization\Domain\Repository\OrganizerRepository: '@App\Organization\Infrastructure\Persistence\Doctrine\DoctrineOrganizerRepository'
    App\Organization\Domain\Repository\OrganizationRepository: '@App\Organization\Infrastructure\Persistence\Doctrine\DoctrineOrganizationRepository'
    App\Organization\Domain\Repository\CheckoutSessionRepository: '@App\Organization\Infrastructure\Persistence\Doctrine\DoctrineCheckoutSessionRepository'
    App\Organization\Domain\Service\PasswordHasher: '@App\Organization\Infrastructure\Password\NativePasswordHasher'
    App\Organization\Domain\Service\AccessTokenIssuer: '@App\Organization\Infrastructure\Security\LexikAccessTokenIssuer'
    App\Organization\Domain\Service\PaymentGateway: '@App\Organization\Infrastructure\Payment\FakePaymentGateway'

    Lexik\Bundle\JWTAuthenticationBundle\Services\JWTTokenManagerInterface: '@lexik_jwt_authentication.jwt_manager'