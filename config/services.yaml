# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/Competition/{Application,Infrastructure} available as services.
    # Domain is excluded: none of its value objects/entities are meant to be DI services
    # (hexagonal purity - Domain has no framework awareness), so they shouldn't clutter
    # the container even though Symfony tolerates them being swept in without erroring.
    App\Competition\:
        resource: '../src/Competition/*'
        exclude:
            - '../src/Competition/Domain'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Competition\Application\CreateCompetition\CreateCompetitionHandler:
        tags: ['messenger.message_handler']

    App\Competition\Application\RegisterTeam\RegisterTeamHandler:
        tags: ['messenger.message_handler']

    App\Competition\Domain\Repository\CompetitionRepository: '@App\Competition\Infrastructure\Persistence\Doctrine\DoctrineCompetitionRepository'
    App\Competition\Domain\Repository\PlayerRepository: '@App\Competition\Infrastructure\Persistence\Doctrine\DoctrinePlayerRepository'
    # TeamRepository ne porte que nextIdentity() (Team n'a pas de persistance propre, voir ADR 022) :
    # l'implémentation InMemory suffit aussi en production, pas de DoctrineTeamRepository nécessaire.
    App\Competition\Domain\Repository\TeamRepository: '@App\Competition\Infrastructure\Persistence\InMemory\InMemoryTeamRepository'