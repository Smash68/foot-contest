security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        organizers:
            id: App\Organization\Infrastructure\Security\OrganizerUserProvider
        players:
            id: App\Competition\Infrastructure\Security\PlayerUserProvider
        # Withdraw accepts either a Player (the team's captain) or an Organizer (owning the
        # competition) - tries players first (cheaper, no cross-context call), then organizers.
        players_or_organizers:
            chain:
                providers: [players, organizers]
        users_in_memory: { memory: null }

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # JWT-authenticated firewall scoped to the one Organization endpoint that needs to
        # know the current organizer (POST /organizations/checkout). Every other Organization
        # route (/organizers, /login, /organizations/checkout-webhook) falls through to "main"
        # untouched, same as every Competition route.
        organization_checkout:
            pattern: ^/organizations/checkout$
            stateless: true
            provider: organizers
            jwt: ~
        # JWT-authenticated firewall for the one Competition endpoint that needs to know the
        # current organizer (POST /competitions, to attach the new Competition to one of their
        # Organizations). Every other Competition route falls through to "main" untouched.
        create_competition:
            pattern: ^/competitions$
            stateless: true
            provider: organizers
            jwt: ~
        # JWT-authenticated firewall for the one Competition endpoint that needs to know the
        # current player (POST /competitions/{id}/teams, to register them as the team's
        # captain). Every other Competition route falls through to "main" untouched.
        register_team:
            pattern: ^/competitions/[^/]+/teams$
            stateless: true
            provider: players
            jwt: ~
        # JWT-authenticated firewall for the one Competition endpoint that needs to know the
        # current organizer (POST /competitions/{id}/close-registration, only the organizer
        # owning the competition may close it). Every other Competition route falls through
        # to "main" untouched.
        close_registration:
            pattern: ^/competitions/[^/]+/close-registration$
            stateless: true
            provider: organizers
            jwt: ~
        # JWT-authenticated firewall for the one Competition endpoint that accepts two actor
        # types (DELETE /competitions/{id}/teams/{teamId}) : the team's captain (Player) or
        # the organizer owning the competition (Organizer) may withdraw a team. Every other
        # Competition route falls through to "main" untouched.
        withdraw:
            pattern: ^/competitions/[^/]+/teams/[^/]+$
            stateless: true
            provider: players_or_organizers
            jwt: ~
        # JWT-authenticated firewall for the one Competition endpoint that needs to know the
        # current player (POST /competitions/{id}/teams/{teamId}/join-requests, to record them
        # as the applicant). Every other Competition route falls through to "main" untouched.
        request_to_join_team:
            pattern: ^/competitions/[^/]+/teams/[^/]+/join-requests$
            stateless: true
            provider: players
            jwt: ~
        # JWT-authenticated firewall for the one Competition endpoint that needs to know the
        # current player (POST .../join-requests/{playerId}/approve, only the team's captain
        # may approve a pending join request). Every other Competition route falls through
        # to "main" untouched.
        approve_join_request:
            pattern: ^/competitions/[^/]+/teams/[^/]+/join-requests/[^/]+/approve$
            stateless: true
            provider: players
            jwt: ~
        # JWT-authenticated firewall for the one Competition endpoint that needs to know the
        # current player (POST .../join-requests/{playerId}/reject, only the team's captain
        # may reject a pending join request). Every other Competition route falls through
        # to "main" untouched.
        reject_join_request:
            pattern: ^/competitions/[^/]+/teams/[^/]+/join-requests/[^/]+/reject$
            stateless: true
            provider: players
            jwt: ~
        main:
            lazy: true
            provider: users_in_memory

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/organizations/checkout$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/competitions$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/competitions/[^/]+/teams$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/competitions/[^/]+/close-registration$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/competitions/[^/]+/teams/[^/]+/join-requests$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/competitions/[^/]+/teams/[^/]+/join-requests/[^/]+/approve$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/competitions/[^/]+/teams/[^/]+/join-requests/[^/]+/reject$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/competitions/[^/]+/teams/[^/]+$, roles: IS_AUTHENTICATED_FULLY }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
